services:

  # Servicio 1: API de Node.js
  cliente-api:
    build:
      context: ./cliente-api
      dockerfile: Dockerfile
    env_file:
      - cliente-api/.env
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Servicio 2: PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=compras_full_db
      - POSTGRES_USER=microservicios
      - POSTGRES_PASSWORD=microservicios123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservicios"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: